<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090E17"/>
    </linearGradient>

    <!-- Ambient Center Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#06B6D4" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#080C14" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <style>
    .brand-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 48px;
      font-weight: 800;
      letter-spacing: -0.5px;
      fill: url(#textGradient);
      text-anchor: middle;
    }
    .badge-label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      fill: #38BDF8;
      text-anchor: middle;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 18px;
      font-weight: 500;
      fill: #94A3B8;
      text-anchor: middle;
    }
    .feature-tag-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 12px;
      font-weight: 600;
      fill: #F1F5F9;
      text-anchor: middle;
    }
    .subbar-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 12px;
      fill: #64748B;
      text-anchor: middle;
    }
  </style>

  <!-- Background Base (No Left Blue Line) -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGradient)"/>
  <rect width="1200" height="340" rx="16" fill="url(#gridPattern)"/>
  <rect width="1200" height="340" rx="16" fill="url(#centerGlow)"/>

  <!-- Subtle Uniform Border Frame -->
  <rect width="1198" height="338" x="1" y="1" rx="15" fill="none" stroke="#1E293B" stroke-width="1.2"/>

  <!-- Centered Top Tag Pill -->
  <g transform="translate(440, 38)">
    <rect width="320" height="28" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
    <circle cx="28" cy="14" r="5" fill="#38BDF8"/>
    <text x="168" y="18" class="badge-label">Autonomous Research Ecosystem</text>
  </g>

  <!-- Centered Brand Title -->
  <text x="600" y="128" class="brand-title">Research-Skill-UmarIqbal</text>

  <!-- Centered Subtitle -->
  <text x="600" y="168" class="subtitle">From Raw Concepts and Data to Submission-Ready Academic Manuscripts and Slide Decks</text>

  <!-- Centered Feature Pills Row (Total Width = 1090, Centered at x=600, Start x=55) -->
  <g transform="translate(55, 218)">
    <!-- Pill 1: Zero Em-Dashes -->
    <g transform="translate(0, 0)">
      <rect width="150" height="38" rx="8" fill="#1E1E2E" stroke="#E11D48" stroke-width="1.2"/>
      <circle cx="20" cy="19" r="4" fill="#E11D48"/>
      <text x="82" y="23" class="feature-tag-text">Zero Em-Dashes</text>
    </g>

    <!-- Pill 2: 4 Difficulty Tiers -->
    <g transform="translate(162, 0)">
      <rect width="165" height="38" rx="8" fill="#0C2538" stroke="#0EA5E9" stroke-width="1.2"/>
      <circle cx="20" cy="19" r="4" fill="#0EA5E9"/>
      <text x="90" y="23" class="feature-tag-text">4 Difficulty Tiers</text>
    </g>

    <!-- Pill 3: Multi-Journal LaTeX -->
    <g transform="translate(339, 0)">
      <rect width="175" height="38" rx="8" fill="#241530" stroke="#A855F7" stroke-width="1.2"/>
      <circle cx="20" cy="19" r="4" fill="#A855F7"/>
      <text x="96" y="23" class="feature-tag-text">Multi-Journal LaTeX</text>
    </g>

    <!-- Pill 4: Word DOCX + PDF -->
    <g transform="translate(526, 0)">
      <rect width="165" height="38" rx="8" fill="#2E1C0C" stroke="#F97316" stroke-width="1.2"/>
      <circle cx="20" cy="19" r="4" fill="#F97316"/>
      <text x="90" y="23" class="feature-tag-text">Word DOCX + PDF</text>
    </g>

    <!-- Pill 5: 16:9 Academic Slides -->
    <g transform="translate(703, 0)">
      <rect width="190" height="38" rx="8" fill="#092B20" stroke="#10B981" stroke-width="1.2"/>
      <circle cx="20" cy="19" r="4" fill="#10B981"/>
      <text x="103" y="23" class="feature-tag-text">16:9 Academic Slides</text>
    </g>

    <!-- Pill 6: Clean Workspace -->
    <g transform="translate(905, 0)">
      <rect width="175" height="38" rx="8" fill="#1E293B" stroke="#64748B" stroke-width="1.2"/>
      <circle cx="20" cy="19" r="4" fill="#64748B"/>
      <text x="96" y="23" class="feature-tag-text">Clean Workspace</text>
    </g>
  </g>

  <!-- Centered Bottom Sub-bar -->
  <text x="600" y="302" class="subbar-text">
    arXiv Discovery  •  Gap Analysis  •  Scientific Simulation  •  Nature/IEEE Figures  •  Anti-AI Humanizer  •  MIT Licensed
  </text>
</svg>
